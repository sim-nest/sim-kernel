[package]
name = "sim-kernel"
version = "0.4.0"
edition = "2024"
license = "MPL-2.0"
description = "Small protocol kernel contracts for the expandable SIM Rust runtime."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-kernel"
homepage = "https://github.com/sim-nest/sim-kernel"

[workspace]
resolver = "3"
members = [
  "crates/xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-kernel"
homepage = "https://github.com/sim-nest/sim-kernel"

[workspace.lints.rust]
unsafe_code = "forbid"

[features]
# Re-exposes the ambient `Cx::grant`/`grant_named` for test/fixture setup only.
# Never enable in a production dependency: in a default build the sole capability
# grant path is a host-held `GrantSeat`.
test-support = []

[dependencies]
thiserror = "1"

[lints]
workspace = true
